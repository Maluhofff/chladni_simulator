<!DOCTYPE html>
<html lang="Pt-BR">
    
<head>
    <meta charset="UTF-8">
    <title>Simulador de figuras de Chladni</title>
    <style>
        body {
            background-color: rgb(27, 26, 26);
            color: rgb(5, 228, 79);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .controls {
            margin-bottom: 15px;
            background: #0f0f0f;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .math-box {
            margin-bottom: 15px;
            background: #1a1a1a;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #76ff03;
        }
        label {
            margin-right: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            margin-right: 20px;
            cursor: pointer;
        }
        canvas {
            border: 2px solid #5c0606;
            background-color: #000;
        }
    </style>
</head>
<body>
    <h1>Simulador de figuras de Chladni</h1>
    
    <div class="controls">
        <label for="sliderN">n: <span id="valN">3</span></label>
        <input type="range" id="sliderN" min="1" max="10" value="3">
        
        <label for="sliderM">m: <span id="valM">5</span></label>
        <input type="range" id="sliderM" min="1" max="10" value="5">
    </div>

    <div class="math-box" id="mathOutput">
        Calculando equação...
    </div>

    <canvas id="chladniCanvas" width="400" height="400"></canvas>

    <script src="script.js"></script>
</body>
</html>
